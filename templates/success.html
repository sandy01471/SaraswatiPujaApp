<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donation Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: green;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 15px;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
            color: #000;
        }

        .utr {
            background: #f8f8f8;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            word-break: break-word;
        }

        .home {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #ff7a00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .home:hover {
            background: #e66d00;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="success-icon">🙏</div>

    <h1>✅ Donation Recorded</h1>

    <h2>Thank you {{ name }}!</h2>

    <p>Your donation has been successfully recorded.</p>

    <p class="amount">
        Donation Amount: ₹{{ amount }}
    </p>

    <div class="utr">
        <strong>UTR / UPI Ref No.</strong><br>
        {{ utr }}
    </div>

    <a href="/" class="home">
        🏠 Back to Home
    </a>

</div>

</body>
</html>
