<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donation Successful</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 50px 20px;
        }

        .box {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: green;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 15px;
        }

        p {
            color: #555;
            font-size: 17px;
        }

        .amount {
            font-size: 22px;
            font-weight: bold;
        }

        .utr {
            background: #f8f8f8;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            word-break: break-all;
        }

        .buttons {
            margin-top: 25px;
        }

        a {
            display: block;
            margin: 12px auto;
            padding: 12px 20px;
            background: #ff7a00;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            max-width: 220px;
        }

        a:hover {
            background: #e66d00;
        }

        .home {
            background: #555;
        }

        .home:hover {
            background: #333;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="success-icon">🙏</div>

        <h1>✅ Donation Recorded</h1>

        <h2>Thank you {{ name }}!</h2>

        <p>
            Your donation has been successfully recorded.
        </p>

        <p class="amount">
            Donation Amount: ₹{{ amount }}
        </p>

        <div class="utr">
            <strong>UTR / UPI Ref No.:</strong><br>
            {{ utr }}
        </div>

        <div class="buttons">

            <a href="/records">
                📋 View Donation Records
            </a>

            <a href="/" class="home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
